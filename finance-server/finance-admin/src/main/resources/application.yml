server:
  port: 9010

spring:
  application:
    name: finance-server
  profiles:
    active: dev
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 认证配置（密钥生产环境必须用环境变量覆盖，禁止提交真实密钥）
finance:
  jwt:
    secret: ${JWT_SECRET:finance-system-jwt-secret-key-please-change-0123456789}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
  auth:
    max-fail: ${AUTH_MAX_FAIL:5}
    lock-minutes: ${AUTH_LOCK_MINUTES:15}

# Gate 7（W1 审批流）：启用 Flowable 引擎，运行时表（ACT_*）由引擎自管理
# （database-schema-update=true，仅影响 Flowable 自身表；业务表仍走 Flyway，见 rule-registry R12 例外登记）
flowable:
  database-schema-update: true
  async-executor-activate: false
  process-definition-location-prefix: classpath:/processes/

# MinIO 附件存储（部署 Gate 接入）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:finance}
