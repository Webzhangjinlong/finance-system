# 测试环境配置（本机 PG17 测试库 / CI services.postgres）
# 与 application.yml 合并生效；@ActiveProfiles("test") 激活
# Gate 7：启用 Flowable（W1 审批流测试需要引擎），ACT_* 表由引擎在测试库自建
spring:
  datasource:
    url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5432}/${TEST_DB_NAME:finance-system-test}
    username: ${TEST_DB_USER:postgres}
    password: ${TEST_DB_PASSWORD:postgres}
